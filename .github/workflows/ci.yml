name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: python -m pip install build 'setuptools>=77' wheel pytest
      - name: Build and exercise installed distributions
        run: python scripts/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: finance-labs-distributions
          path: dist/release/
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab:
          - prompt-firewall
          - etf-liquidity
          - margin-cascade
          - factor-crowding
          - bond-auction-tail
          - options-skew
          - covenant-headroom
          - guidance-drift
          - microstructure-stress
          - central-bank-path
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: labs/${{ matrix.lab }}/pyproject.toml
      - name: Install lab and test runner
        run: python -m pip install -e "labs/${{ matrix.lab }}" pytest
      - name: Test lab
        working-directory: labs/${{ matrix.lab }}
        run: PYTHONPATH=src python -m pytest -q
