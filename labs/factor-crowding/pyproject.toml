[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-crowding-radar"
version = "0.1.0"
description = "Offline CLI for detecting crowded factor exposures and unwind risk in portfolios."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Johan Vaz", email = "v.johan2234@gmail.com" }]
keywords = ["finance", "quant", "risk", "factor-investing", "portfolio"]
dependencies = []

[project.scripts]
factor-crowding-radar = "factor_crowding_radar.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
