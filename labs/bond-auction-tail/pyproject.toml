[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bond-auction-tail-monitor"
version = "0.1.0"
description = "Offline Treasury auction tail and demand stress monitor"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johan Vaz", email = "v.johan2234@gmail.com" }]
keywords = ["treasury", "auction", "finance", "risk", "cli"]
dependencies = []

[project.scripts]
bond-auction-tail-monitor = "bond_auction_tail_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
