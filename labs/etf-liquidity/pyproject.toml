[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-liquidity-stress-lab"
version = "0.1.0"
description = "Offline ETF liquidity illusion and redemption-stress diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johan Vaz", email = "v.johan2234@gmail.com" }]
keywords = ["finance", "etf", "liquidity", "stress-testing", "quant"]
dependencies = []

[project.scripts]
etf-liquidity-stress = "etf_liquidity_stress_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
