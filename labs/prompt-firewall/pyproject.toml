[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptfirewall-lab"
version = "0.1.0"
description = "Offline prompt-injection risk scoring for LLM app conversations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Johan Vaz", email = "v.johan2234@gmail.com" }]
keywords = ["prompt-injection", "llm-security", "ai-safety", "cli", "security"]
dependencies = []

[project.scripts]
promptfirewall-lab = "promptfirewall_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
